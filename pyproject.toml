[tool.poetry]
name = "practicalmeeg-workshop"
version = "0.1.0"
description = "HyPyP Workshop for Practical MEG/EEG 2025"
authors = ["ramdam17 <remy.ramadour.labs@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
hypyp = ">=0.5.0b14,<0.6.0"
pandas = ">=2.3.3,<3.0.0"
matplotlib = ">=3.10.7,<4.0.0"
numpy = ">=2.3.4,<3.0.0"
scipy = ">=1.16.2,<2.0.0"
jupyter = ">=1.1.1,<2.0.0"
notebook = ">=7.4.7,<8.0.0"
pyxdf = "*"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
